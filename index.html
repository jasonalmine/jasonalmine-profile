<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Jason Almine | Operator &amp; Builder</title>
    <meta name="description" content="Jason Almine builds GoHighLevel CRMs, n8n automations, and reporting systems for service businesses." />
    <meta name="author" content="Jason Almine" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F8F6F2" />
    <link rel="canonical" href="https://profile.jasonalmine.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/profile.png" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jason Almine" />
    <meta property="og:title" content="Jason Almine | Operator &amp; Builder" />
    <meta property="og:description" content="GoHighLevel CRMs, n8n automations, and reporting systems for service businesses." />
    <meta property="og:url" content="https://profile.jasonalmine.com/" />
    <meta property="og:image" content="https://jasonalmine-profile.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#0E0E0B');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
